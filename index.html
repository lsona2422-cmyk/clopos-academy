<title>Clopos Retention Academy</title>

<style>
/* Layout: бело-голубой фирменный стиль Clopos. Шапка с логотипом, слева карта курса, справа один шаг урока за раз. */
:root{
  --paper:#F2F7FF; --surface:#FFFFFF; --sunken:#E6F0FD; --ink:#0E2246; --muted:#566B8C; --line:#D2E1F6;
  --accent:#1E6FE8; --accent-ink:#FFFFFF; --accent-soft:#E2EDFD;
  --ok:#17794A; --ok-soft:#E1F2E8; --warn:#9A5800; --warn-soft:#FDF3E1; --bad:#B42318; --bad-soft:#FBE5E2;
  --f-display:"Unbounded","Golos Text",system-ui,sans-serif;
  --f-body:"Golos Text",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --r:12px; color-scheme:light;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:15.5px;line-height:1.6;padding-top:env(safe-area-inset-top,0px)}
a{color:var(--accent)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}
h1,h2,h3{text-wrap:balance;line-height:1.25;margin:0}
h1{font-family:var(--f-display);font-weight:700;font-size:clamp(1.4rem,1.1rem + 1.4vw,2rem);letter-spacing:-.01em}
h2{font-family:var(--f-display);font-weight:500;font-size:1.18rem}
h3{font-size:1.03rem;font-weight:600}
p{margin:0}
ul,ol{margin:0;padding-left:1.2em;display:flex;flex-direction:column;gap:4px}
img{max-width:100%}
.eyebrow{font-family:var(--f-mono);font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)} .small{font-size:.9rem}
.top{position:sticky;top:0;z-index:5;background:var(--surface);border-bottom:1px solid var(--line);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:10px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;font-family:var(--f-display);font-weight:700;font-size:1rem;color:var(--ink);text-decoration:none}
.brand small{display:block;font-family:var(--f-mono);font-weight:400;font-size:.68rem;color:var(--muted);letter-spacing:.06em;text-transform:uppercase}
.brand-mark{width:34px;height:34px;flex:none;display:block}
.top .spacer{flex:1}
.toplink{font-weight:600;font-size:.88rem;color:var(--accent);text-decoration:none;border:1px solid var(--line);border-radius:8px;padding:6px 12px;background:var(--accent-soft)}
.toplink:hover{border-color:var(--accent)}
.who{display:flex;align-items:center;gap:8px;font-size:.88rem}
.who-name{font-weight:600;max-width:180px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.progress-pill{font-family:var(--f-mono);font-size:.78rem;color:var(--muted);display:flex;align-items:center;gap:8px}
.bar{width:90px;height:6px;border-radius:3px;background:var(--sunken);overflow:hidden}
.bar>i{display:block;height:100%;background:var(--ok);width:0;transition:width .3s}
.demo-bar{background:var(--warn-soft);color:var(--warn);font-size:.85rem;padding:8px max(16px,env(safe-area-inset-left,0px));border-bottom:1px solid var(--line)}
.shell{display:grid;grid-template-columns:260px minmax(0,1fr);gap:28px;max-width:1280px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:24px 64px}
nav.side{position:sticky;top:76px;align-self:start;display:flex;flex-direction:column;gap:2px;max-height:calc(100vh - 90px);overflow:auto}
nav.side .grp{font-family:var(--f-mono);font-size:.68rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);padding:14px 10px 4px}
nav.side a{display:flex;align-items:center;gap:10px;padding:7px 10px;border-radius:8px;color:var(--ink);text-decoration:none;font-size:.91rem;line-height:1.35}
nav.side a:hover{background:var(--sunken)}
nav.side a[aria-current="page"]{background:var(--accent-soft);color:var(--accent);font-weight:600}
nav.side a.locked{color:var(--muted)}
nav.side a .dn{font-family:var(--f-mono);font-size:.7rem;width:22px;height:22px;border-radius:50%;border:1.5px solid var(--line);display:grid;place-items:center;flex:none}
nav.side a .dn.done{background:var(--ok);border-color:var(--ok);color:#fff}
nav.side a .dn.cur{border-color:var(--accent);color:var(--accent)}
nav.side a .st{margin-left:auto;font-family:var(--f-mono);font-size:.7rem;color:var(--muted)}
.navsel{display:none;margin-bottom:12px}
.navsel select{width:100%;font:inherit;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--ink)}
@media (max-width:900px){.shell{grid-template-columns:minmax(0,1fr);gap:8px;padding-block:16px 48px}nav.side{display:none}.navsel{display:block}.who-name{display:none}}
main{min-width:0}
section.view{display:flex;flex-direction:column;gap:22px}
.lead{font-size:1.03rem;color:var(--muted);max-width:70ch}
.prose{max-width:74ch;display:flex;flex-direction:column;gap:10px}
.hero{background:var(--accent);color:#fff;border-radius:16px;padding:28px;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:24px;align-items:center}
.hero .eyebrow{color:#CFE0FB}.hero .lead{color:#E4EEFD}.hero h1{color:#fff}.hero .mark{width:110px;height:110px}
@media (max-width:640px){.hero{grid-template-columns:1fr;padding:22px 18px}.hero .mark{display:none}}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:20px;display:flex;flex-direction:column;gap:12px;min-width:0}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:14px}
.grid3{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,220px),1fr));gap:12px}
.chip{display:inline-flex;align-items:center;gap:6px;font-family:var(--f-mono);font-size:.7rem;letter-spacing:.02em;padding:2px 8px;border-radius:999px;border:1px solid transparent;white-space:nowrap;margin:1px 2px 1px 0}
.chip.ok{background:var(--ok-soft);color:var(--ok)} .chip.warn{background:var(--warn-soft);color:var(--warn)} .chip.bad{background:var(--bad-soft);color:var(--bad)} .chip.info{background:var(--accent-soft);color:var(--accent)} .chip.plain{border-color:var(--line);color:var(--muted)}
.note{border:1px solid var(--line);border-left:3px solid var(--warn);background:var(--warn-soft);border-radius:8px;padding:12px 14px;font-size:.93rem;max-width:84ch}
.note.info{border-left-color:var(--accent);background:var(--accent-soft)}
.path{font-family:var(--f-mono);font-size:.82rem;background:var(--sunken);border-radius:5px;padding:1px 6px}
button{font:inherit;font-size:.92rem;font-weight:600;border-radius:8px;padding:9px 16px;border:1px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer}
button:hover{background:var(--sunken)} button.sm{padding:5px 11px;font-size:.82rem} button.danger{color:var(--bad);border-color:color-mix(in srgb,var(--bad) 40%,var(--line))} button.danger:hover{background:color-mix(in srgb,var(--bad) 8%,transparent)}
button.primary{background:var(--accent);color:#fff;border-color:var(--accent)} button.primary:hover{filter:brightness(1.08);background:var(--accent)}
button:disabled{opacity:.5;cursor:not-allowed}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.days{display:flex;flex-direction:column;gap:10px}
.dcard{display:grid;grid-template-columns:52px minmax(0,1fr) auto;gap:14px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;text-decoration:none;color:var(--ink)}
.dcard:hover{border-color:var(--accent)} .dcard.locked{opacity:.6}
.dcard .num{font-family:var(--f-display);font-size:1.3rem;font-weight:700;color:var(--accent);text-align:center;line-height:1}
.dcard .num small{display:block;font-family:var(--f-mono);font-size:.6rem;font-weight:400;color:var(--muted);letter-spacing:.08em;margin-top:4px}
.dcard p{font-size:.9rem;color:var(--muted)}
@media (max-width:520px){.dcard{grid-template-columns:40px minmax(0,1fr)}.dcard>.chip{grid-column:2;justify-self:start}}
.steps{display:flex;gap:6px;flex-wrap:wrap}
.steps button{padding:6px 10px;font-size:.8rem;font-weight:500;font-family:var(--f-mono);display:flex;gap:6px;align-items:center;text-align:left}
.steps button.cur{border-color:var(--accent);color:var(--accent);background:var(--accent-soft)} .steps button.seen{color:var(--ok)}
.lesson{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:24px;display:flex;flex-direction:column;gap:16px;min-width:0}
@media (max-width:520px){.lesson{padding:18px 14px}}
.lesson>h2{font-size:1.25rem}
.lesson .body{display:flex;flex-direction:column;gap:14px;max-width:80ch;min-width:0} .lesson .body.wide{max-width:none}
.stepnav{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;border-top:1px solid var(--line);padding-top:16px}
.flowh{display:flex;align-items:stretch;gap:8px;flex-wrap:wrap}
.flowh .node{flex:1 1 140px;border:1px solid var(--line);border-radius:8px;padding:10px 12px;background:var(--paper);font-size:.88rem;display:flex;flex-direction:column;gap:3px;min-width:0}
.flowh .node.hl{border-color:var(--accent);background:var(--accent-soft)}
.flowh .arr{align-self:center;color:var(--muted);font-family:var(--f-mono)}
@media (max-width:640px){.flowh{flex-direction:column}.flowh .node{flex:none}.flowh .arr{transform:rotate(90deg);align-self:center}}
.levels{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,210px),1fr));gap:12px}
.level{border:1px solid var(--line);border-radius:var(--r);padding:14px;background:var(--paper);display:flex;flex-direction:column;gap:6px}
.level .n{font-family:var(--f-mono);font-size:.75rem;color:var(--accent)} .level .ex{font-size:.88rem;color:var(--muted)}
details.acc{background:var(--surface);border:1px solid var(--line);border-radius:var(--r)} details.acc+details.acc{margin-top:8px}
details.acc>summary{list-style:none;cursor:pointer;padding:12px 16px;display:flex;gap:12px;align-items:center}
details.acc>summary::-webkit-details-marker{display:none}
details.acc>summary::after{content:"+";margin-left:auto;font-family:var(--f-mono);color:var(--muted);font-size:1.1rem}
details.acc[open]>summary::after{content:"−"}
.acc-body{padding:0 16px 16px;display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,220px),1fr));gap:14px;font-size:.93rem}
.acc-body .blk{display:flex;flex-direction:column;gap:6px;min-width:0} .acc-body .full{grid-column:1/-1}
.tbl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
table{border-collapse:collapse;width:100%;font-size:.9rem}
th,td{text-align:left;padding:9px 12px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-family:var(--f-mono);font-size:.68rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600;background:var(--sunken)}
tr:last-child td{border-bottom:0}
td.num,th.num{text-align:right;font-family:var(--f-mono);font-variant-numeric:tabular-nums;white-space:nowrap}
tr.bad td{background:var(--bad-soft)}
td input,td select{width:100%;min-width:90px;font:inherit;font-size:.88rem;padding:5px 7px;border:1px solid var(--line);border-radius:6px;background:var(--paper);color:var(--ink)}
td input[type=number]{font-family:var(--f-mono);text-align:right}
label.f{display:flex;flex-direction:column;gap:4px;font-size:.85rem;color:var(--muted);min-width:0}
label.f input,label.f select,label.f textarea{font:inherit;font-size:.95rem;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:9px 11px;width:100%}
.form-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,190px),1fr));gap:12px}
input.search{font:inherit;width:100%;max-width:420px;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--ink)}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,140px),1fr));gap:10px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:10px 12px;display:flex;flex-direction:column;gap:2px}
.kpi .v{font-family:var(--f-mono);font-variant-numeric:tabular-nums;font-size:1.12rem;font-weight:600} .kpi .l{font-size:.78rem;color:var(--muted)}
.kpi.ok .v{color:var(--ok)} .kpi.warn .v{color:var(--warn)} .kpi.bad .v{color:var(--bad)}
.tool{background:var(--paper);border:1px solid var(--line);border-radius:var(--r);padding:18px;display:flex;flex-direction:column;gap:12px;min-width:0}
.flow{display:flex;flex-direction:column;border-left:2px solid var(--line);margin-left:10px}
.step{position:relative;padding:0 0 18px 26px}
.step::before{content:attr(data-n);position:absolute;left:-13px;top:0;width:24px;height:24px;border-radius:50%;background:var(--surface);border:2px solid var(--accent);color:var(--accent);font-family:var(--f-mono);font-size:.72rem;display:grid;place-items:center;font-weight:600}
.task{display:grid;grid-template-columns:auto minmax(0,1fr);gap:12px;padding:14px 0;border-bottom:1px dashed var(--line)} .task:last-child{border-bottom:0}
.task input[type=checkbox]{width:18px;height:18px;margin-top:3px;accent-color:var(--ok)}
.task .tb{display:flex;flex-direction:column;gap:6px;min-width:0} .task details{font-size:.9rem} .task details summary{cursor:pointer;color:var(--accent);font-weight:500}
.task details div{margin-top:6px;padding:10px 12px;background:var(--ok-soft);border-radius:8px}
.check{display:flex;gap:10px;align-items:flex-start;padding:9px 0;border-bottom:1px dashed var(--line);font-size:.94rem} .check:last-child{border-bottom:0}
.check input{margin-top:5px;width:16px;height:16px;accent-color:var(--accent);flex:none} .check .w{margin-left:auto;font-family:var(--f-mono);font-size:.75rem;color:var(--muted);white-space:nowrap}
.gauge{height:10px;border-radius:5px;background:var(--sunken);overflow:hidden} .gauge i{display:block;height:100%;width:0;transition:width .3s}
.gl{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,290px),1fr));gap:10px}
.gl .t{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:12px 14px} .gl .t b{display:block;margin-bottom:2px} .gl .t span{font-size:.9rem;color:var(--muted)}
.q{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:20px;display:flex;flex-direction:column;gap:14px} .lesson .q{padding:0;border:0}
.q .qn{font-family:var(--f-mono);font-size:.75rem;color:var(--muted)} .q .qt{font-size:1.04rem;font-weight:600;max-width:76ch}
.opts{display:flex;flex-direction:column;gap:8px}
.opt{text-align:left;font-weight:500;display:flex;gap:10px;align-items:flex-start;padding:11px 14px;line-height:1.45}
.opt .k{font-family:var(--f-mono);font-size:.78rem;color:var(--muted);flex:none;margin-top:1px}
.opt.right{border-color:var(--ok);background:var(--ok-soft)} .opt.wrong{border-color:var(--bad);background:var(--bad-soft)} .opt[disabled]{opacity:1;cursor:default}
.numans{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.numans input{font-family:var(--f-mono);font-size:1rem;padding:9px 12px;border:1px solid var(--line);border-radius:8px;background:var(--paper);color:var(--ink);width:200px;max-width:100%}
.expl{font-size:.93rem;border-radius:8px;padding:12px 14px;background:var(--sunken)}
.qbar{display:flex;gap:3px;flex-wrap:wrap;max-width:60%} .qbar i{width:10px;height:6px;border-radius:3px;background:var(--sunken)} .qbar i.r{background:var(--ok)} .qbar i.w{background:var(--bad)} .qbar i.c{background:var(--accent)}
.receipt{background:var(--surface);border:1px solid var(--line);border-top:2px dashed var(--line);border-bottom:2px dashed var(--line);max-width:380px;width:100%;padding:22px 20px;font-family:var(--f-mono);font-size:.82rem;line-height:1.55}
.receipt .c{text-align:center} .receipt hr{border:0;border-top:1px dashed var(--muted);margin:10px 0} .receipt .ln{display:flex;justify-content:space-between;gap:10px} .receipt .big{font-size:1.1rem;font-weight:600} .receipt .pass{color:var(--ok)} .receipt .fail{color:var(--bad)}
.media-list{display:flex;flex-direction:column;gap:16px}
.media{border:1px solid var(--line);border-radius:var(--r);padding:16px;background:var(--paper);display:flex;flex-direction:column;gap:12px}
.media-head{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:center}
.media video{width:100%;border-radius:8px;background:#0E2246;aspect-ratio:1280/800;display:block;margin-top:6px}
.sim-frame{position:relative;border-radius:8px;overflow:hidden;border:1px solid var(--line);cursor:crosshair;margin-top:6px;aspect-ratio:1440/900;background:#fff}
.sim-frame img{display:block;width:100%;height:100%;object-fit:cover}
.sim-frame .hot{position:absolute;border-radius:6px;pointer-events:none}
.sim-frame .hot.show{border:3px solid #FF3B30;box-shadow:0 0 0 4px rgba(255,59,48,.25);animation:pulse 1.2s infinite}
@keyframes pulse{50%{box-shadow:0 0 0 8px rgba(255,59,48,.1)}}
.sim-text{font-weight:600;margin-top:6px} .sim-text.ok{color:var(--ok)}
.minibar{height:5px;border-radius:3px;background:var(--sunken);overflow:hidden;margin-top:4px;min-width:60px} .minibar i{display:block;height:100%;background:var(--ok)}
.auth{min-height:100vh;display:grid;place-items:center;padding:24px max(16px,env(safe-area-inset-left,0px))}
.auth-card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:28px;width:100%;max-width:440px;display:flex;flex-direction:column;gap:16px;box-shadow:0 10px 40px rgba(30,111,232,.08)}
.auth-card form{display:flex;flex-direction:column;gap:12px}
.auth-brand{display:flex;gap:12px;align-items:center} .auth-brand b{font-family:var(--f-display);display:block} .auth-brand span{font-size:.8rem;color:var(--muted)}
.auth-logo{width:44px;height:44px}
#teamBox{display:flex;flex-direction:column;gap:18px}
.langsw select{font:inherit;font-size:.85rem;font-weight:600;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:5px 8px;cursor:pointer}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.auth-top{display:flex;justify-content:space-between;gap:12px;align-items:flex-start;flex-wrap:wrap}
footer.foot{font-size:.8rem;color:var(--muted);border-top:1px solid var(--line);padding-top:14px;margin-top:10px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important;scroll-behavior:auto!important}}
</style>
</head>

<div id="app"><div class="auth"><p class="muted">Загрузка…</p></div></div>
